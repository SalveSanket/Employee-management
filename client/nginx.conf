server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API requests: forward to the backend container by its name
    location /record {
        proxy_pass http://emp-server:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React pages: unknown paths (like /edit/123) return index.html,
    # so React Router can show the right page after a refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
